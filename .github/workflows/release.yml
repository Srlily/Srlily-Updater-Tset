name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.0). Leave empty to skip publish."
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/Srlily.UpdaterTset/Srlily.UpdaterTset.csproj
  APP_NAME: Srlily.UpdaterTset

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, win-x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v') {
            "version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Not a version tag; publish skipped."
            exit 0
          }
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version=$version Tag=$tag RID=${{ matrix.rid }}"

      - name: Setup .NET
        if: steps.ver.outputs.publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Sync version into project
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $props = "Directory.Build.props"
          (Get-Content $props -Raw) `
            -replace '<Version>.*?</Version>', "<Version>$version</Version>" `
            -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>" `
            -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$version.0</FileVersion>" `
            -replace '<InformationalVersion>.*?</InformationalVersion>', "<InformationalVersion>$version</InformationalVersion>" |
            Set-Content $props -NoNewline

          $manifestPath = "latest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.releases.downloadPattern = "Srlily.UpdaterTset-v{version}-${{ matrix.rid }}-portable.zip"
          $manifest.releases.assetName = "Srlily.UpdaterTset-v{version}-${{ matrix.rid }}-portable.zip"
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $manifestPath -Encoding utf8

          Write-Host "Synced version $version for ${{ matrix.rid }}"

      - name: Publish self-contained
        if: steps.ver.outputs.publish == 'true'
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Ensure Inno Setup
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup -y --no-progress
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }

          # Ensure official Chinese language pack exists next to ISCC
          $isccDir = Split-Path $iscc -Parent
          $official = Join-Path $isccDir "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $official)) {
            Write-Host "Fetching official ChineseSimplified.isl..."
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl"
            try {
              Invoke-WebRequest -Uri $url -OutFile $official -Headers @{ "User-Agent" = "Srlily-Updater-Tset-CI" }
            } catch {
              Write-Host "Official download failed, copy bundled file as official pack"
              Copy-Item "installer\Languages\ChineseSimplified.isl" $official -Force
            }
          }
          if (Test-Path $official) {
            # force UTF-8 BOM
            $utf8Bom = New-Object System.Text.UTF8Encoding $true
            $text = [System.IO.File]::ReadAllText($official)
            if ($text -notmatch 'LanguageName=') {
              $text = [System.IO.File]::ReadAllText("installer\Languages\ChineseSimplified.isl")
            }
            [System.IO.File]::WriteAllText($official, $text.TrimStart([char]0xFEFF), $utf8Bom)
            Write-Host "Chinese ISL: $official"
            Select-String -Path $official -Pattern "LanguageName" | Select-Object -First 2
          }

          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "ISCC=$iscc"
        id: iscc

      - name: Build setup.exe (Inno Setup)
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $iscc = "${{ steps.iscc.outputs.iscc }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          & $iscc "installer\Setup.iss" `
            "/DAppVersion=$version" `
            "/DAppArch=$rid" `
            "/DPublishDir=..\publish\$rid" `
            "/O$((Resolve-Path artifacts).Path)" `
            "/FSrlily.UpdaterTset-v$version-$rid-setup"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Write-Host "setup.exe created"

      - name: Install WiX 5 & build MSI
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $arch = switch ($rid) {
            "win-x64"   { "x64" }
            "win-arm64" { "arm64" }
            "win-x86"   { "x86" }
            default     { "x64" }
          }

          # Pin WiX 5 — v7 requires OSMF EULA acceptance
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix tool install failed" }

          $pub = (Resolve-Path "publish\$rid").Path
          $ast = (Resolve-Path "src\Srlily.UpdaterTset\Assets").Path

          wix build "installer\Package.wxs" `
            -d "PublishDir=$pub" `
            -d "AssetsDir=$ast" `
            -d ProductVersion=$version `
            -arch $arch `
            -o "artifacts\Srlily.UpdaterTset-v$version-$rid.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          Write-Host "msi created"

      - name: Package portable zip + checksums
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $base = "Srlily.UpdaterTset-v$version-$rid"

          # Ship updater host config inside portable package
          if (Test-Path "src/Srlily.UpdaterTset/updater.config.json") {
            Copy-Item "src/Srlily.UpdaterTset/updater.config.json" "publish/$rid/updater.config.json" -Force
          }

          $zip = "artifacts/$base-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "publish/$rid/*" -DestinationPath $zip

          $lines = @()
          foreach ($f in Get-ChildItem artifacts/* -File | Where-Object { $_.Name -match "($rid|latest\.json)" }) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$h  $($f.Name)"
            Write-Host "SHA256 $($f.Name) = $h"
          }
          $lines | Set-Content "artifacts/SHA256SUMS-$rid.txt" -Encoding ascii

          Copy-Item latest.json "artifacts/latest-$rid.json"

      - name: Upload arch artifacts
        if: steps.ver.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publish $tag / $version"

      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: pkg-*
          merge-multiple: true

      - name: Assemble release assets + checksums
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          # Copy installers, portable zips, msi, one merged checksum file
          Get-ChildItem collected -Recurse -File | ForEach-Object {
            if ($_.Name -match "setup\.exe$|\.msi$|-portable\.zip$") {
              Copy-Item $_.FullName release-assets/
            }
          }

          # Prefer x64 latest.json as the release metadata file
          $manifest = Join-Path collected "latest-win-x64.json"
          if (-not (Test-Path $manifest)) {
            $manifest = Get-ChildItem collected -Filter "latest-*.json" | Select-Object -First 1 -ExpandProperty FullName
          }
          if ($manifest) { Copy-Item $manifest release-assets/latest.json }

          # Merge checksums
          $lines = @()
          foreach ($f in Get-ChildItem release-assets -File | Where-Object { $_.Name -ne "latest.json" }) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$h  $($f.Name)"
          }
          if ($manifest) {
            $h = (Get-FileHash (Join-Path release-assets "latest.json") -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$h  latest.json"
          }
          $lines | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii

          # Generate channel.json remote feed for Srlily-Updater
          $sums = @{}
          foreach ($line in $lines) {
            $p = $line -split "\s+", 2
            if ($p.Length -eq 2) { $sums[$p[1].Trim()] = $p[0].ToLowerInvariant() }
          }

          $notes = ""
          $notesPath = "release-notes.md"
          if (Test-Path $notesPath) {
            # notes body from changelog will be filled later; keep placeholder if missing
          }

          function Get-RidFromName([string]$n) {
            if ($n -match "win-arm64") { return "win-arm64" }
            if ($n -match "win-x86") { return "win-x86" }
            return "win-x64"
          }

          $assets = @{}
          foreach ($f in Get-ChildItem release-assets -Filter "*-portable.zip" -File) {
            $rid = Get-RidFromName $f.Name
            $sha = $sums[$f.Name]
            $assets[$rid] = [ordered]@{
              url       = "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/$($f.Name)"
              fileName  = $f.Name
              kind      = "portable"
              size      = $f.Length
              sha256    = $sha
              signature = $null
            }
          }

          $changelogNotes = ""
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw -Encoding utf8
            $ver = "${{ steps.ver.outputs.version }}"
            $pattern = "(?ms)^## \[" + [regex]::Escape($ver) + "\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
            $m = [regex]::Match($raw, $pattern)
            if ($m.Success) { $changelogNotes = $m.Groups[1].Value.Trim() }
          }

          $feed = [ordered]@{
            schemaVersion = 1
            appId         = "srlily-updater-tset"
            name          = "Srlily Updater Test"
            channel       = "stable"
            version       = "${{ steps.ver.outputs.version }}"
            pubDate       = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes         = $changelogNotes
            notesUrl      = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
            homepage      = "https://github.com/${{ github.repository }}"
            minOs         = "windows-10"
            runtime       = "net10.0-windows"
            assets        = $assets
          }
          $feed | ConvertTo-Json -Depth 8 | Set-Content release-assets/channel.json -Encoding utf8

          # also expose as latest.json alias name used by some clients
          Copy-Item release-assets/channel.json release-assets/latest.channel.json -Force

          Write-Host "Release assets:"
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Extract changelog section
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $runId = '${{ github.run_id }}'

          function Format-Size([long]$bytes) {
            if ($bytes -ge 1MB) { return ('{0:N2} MB' -f ($bytes / 1MB)) }
            if ($bytes -ge 1KB) { return ('{0:N2} KB' -f ($bytes / 1KB)) }
            return ('{0} B' -f $bytes)
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $changelog = $null
          if (Test-Path CHANGELOG.md) {
            $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          }
          if ($changelog) {
            $changelog = $changelog.TrimStart([char]0xFEFF)
          }

          $section = $null
          if ($changelog) {
            # (?m) so ^ matches each line, not only the file start
            $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)'
            $m = [regex]::Match($changelog, $pattern)
            if ($m.Success) {
              $section = $m.Groups[1].Value.Trim()
              Write-Host "Changelog section matched for $version ($($section.Length) chars)"
            } else {
              Write-Host "WARN: no changelog section for $version"
            }
          }

          if ($section) {
            # Parse CHANGELOG body line-by-line so ### headings stay with their bullets.
            # A lone "### 新增" (heading separated by blank line from bullets) must not be dropped.
            $placeholderRe = '^\s*-\s*(（无）|\(无\)|无|本版本无相关条目|见 CHANGELOG.*)\s*$'
            $secBodyLines = $section -split "`r?`n"
            $start = 0
            for ($i = 0; $i -lt $secBodyLines.Count; $i++) {
              if ($secBodyLines[$i].TrimStart().StartsWith('###')) { $start = $i; break }
              $start = -1
            }
            if ($start -ge 0) {
              $secBodyLines = @($secBodyLines[$start..($secBodyLines.Count - 1)])
            }

            $heading = $null
            $buf = New-Object System.Collections.Generic.List[string]
            $emit = New-Object System.Collections.Generic.List[string]

            foreach ($raw in $secBodyLines) {
              $isHeading = $raw.TrimStart().StartsWith('###')
              if ($isHeading) {
                if ($null -ne $heading) {
                  $trimmedBuf = New-Object System.Collections.Generic.List[string]
                  $started = $false
                  foreach ($c in $buf) {
                    if (-not $started) {
                      if (-not $c.Trim()) { continue }
                      $started = $true
                    }
                    $trimmedBuf.Add($c)
                  }
                  while ($trimmedBuf.Count -gt 0 -and -not $trimmedBuf[$trimmedBuf.Count-1].Trim()) {
                    $trimmedBuf.RemoveAt($trimmedBuf.Count-1)
                  }
                  $real = @($trimmedBuf | Where-Object { $_.Trim() -notmatch $placeholderRe })
                  if ($real.Count -gt 0) {
                    $emit.Add($heading.Trim())
                    $emit.Add('')
                    foreach ($c in $trimmedBuf) { $emit.Add($c) }
                    $emit.Add('')
                  } else {
                    Write-Host "Skip empty section: $($heading.Trim())"
                  }
                }
                $heading = $raw
                $buf = New-Object System.Collections.Generic.List[string]
              } elseif ($null -ne $heading) {
                $buf.Add($raw)
              }
            }
            # flush last section
            if ($null -ne $heading) {
              $trimmedBuf = New-Object System.Collections.Generic.List[string]
              $started = $false
              foreach ($c in $buf) {
                if (-not $started) {
                  if (-not $c.Trim()) { continue }
                  $started = $true
                }
                $trimmedBuf.Add($c)
              }
              while ($trimmedBuf.Count -gt 0 -and -not $trimmedBuf[$trimmedBuf.Count-1].Trim()) {
                $trimmedBuf.RemoveAt($trimmedBuf.Count-1)
              }
              $real = @($trimmedBuf | Where-Object { $_.Trim() -notmatch $placeholderRe })
              if ($real.Count -gt 0) {
                $emit.Add($heading.Trim())
                $emit.Add('')
                foreach ($c in $trimmedBuf) { $emit.Add($c) }
                $emit.Add('')
              } else {
                Write-Host "Skip empty section: $($heading.Trim())"
              }
            }

            foreach ($t in $emit) {
              $lines.Add($t)
            }
          } else {
            $lines.Add("Srlily Updater Test $tag — .NET 10 self-contained 示例应用，用于测试 Srlily-Updater 更新链路。")
            $lines.Add('')
          }

          $lines.Add('## 下载说明')
          $lines.Add('')
          $lines.Add('| 文件 | 类型 | 大小 |')
          $lines.Add('|------|------|------|')

          $files = Get-ChildItem release-assets -File | Sort-Object Name
          foreach ($f in $files) {
            $kind = switch -Regex ($f.Name) {
              '-setup\.exe$'    { '安装向导（Inno Setup）' }
              '\.msi$'          { 'MSI 安装包（WiX 5）' }
              '-portable\.zip$' { '便携包（更新器就地更新）' }
              'SHA256SUMS'      { '校验和清单' }
              'channel\.json'   { '更新器远程 Feed（channel.json）' }
              'latest\.channel' { '更新器远程 Feed 备份' }
              'latest\.json'    { '安装包身份清单（latest.json）' }
              default           { '其他' }
            }
            $lines.Add(('| `{0}` | {1} | {2} |' -f $f.Name, $kind, (Format-Size $f.Length)))
          }

          $lines.Add('')
          $lines.Add('### 如何选择')
          $lines.Add('')
          $lines.Add('- **首次安装**：下载对应架构的 `*-setup.exe` 或 `*.msi`')
          $lines.Add('- **更新器就地更新 / 自动化测试**：使用对应架构的 `*-portable.zip`')
          $lines.Add('- **完整性校验**：对照 `SHA256SUMS.txt` 中的 SHA256')
          $lines.Add('- **更新器元数据**：`latest.json` 记录版本与架构资产名，便于更新器免解压读取')
          $lines.Add('')
          $lines.Add('### 版本信息')
          $lines.Add('')
          $lines.Add(('- 版本标签：`{0}`' -f $tag))
          $lines.Add('- 运行时：.NET 10 self-contained')
          $lines.Add('- 支持架构：win-x64 / win-arm64 / win-x86')
          $lines.Add(('- 构建记录：https://github.com/{0}/actions/runs/{1}' -f $repo, $runId))
          $lines.Add(('- 项目仓库：https://github.com/{0}' -f $repo))

          $body = ($lines -join "`n").Trim() + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $body, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Release notes ready ($($body.Length) chars, $($lines.Count) lines)"
          Get-Content release-notes.md -TotalCount 50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Srlily Updater Test ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          # Do not auto-generate notes from commits (would duplicate CHANGELOG body)
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
